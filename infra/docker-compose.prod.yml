services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET}
      ADMIN_ACCESS_TOKEN_TTL_MINUTES: ${ADMIN_ACCESS_TOKEN_TTL_MINUTES:-30}
      ADMIN_REFRESH_TOKEN_TTL_DAYS: ${ADMIN_REFRESH_TOKEN_TTL_DAYS:-14}
      ADMIN_TOKEN_VERSION: ${ADMIN_TOKEN_VERSION:-1}
      SECRET_KEY: ${SECRET_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:-}
      TELEGRAM_ADMIN_WEBAPP_URL: ${TELEGRAM_ADMIN_WEBAPP_URL:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_BOT_WEBHOOK_SECRET: ${TELEGRAM_BOT_WEBHOOK_SECRET:-}
      ALLOW_INSECURE_HEADER_AUTH: ${ALLOW_INSECURE_HEADER_AUTH:-0}
      ALLOW_TELEGRAM_ID_HEADER_AUTH: ${ALLOW_TELEGRAM_ID_HEADER_AUTH:-1}
      DEV_AUTO_CREATE_USER_FROM_HEADER: ${DEV_AUTO_CREATE_USER_FROM_HEADER:-0}
      DEV_DEFAULT_TELEGRAM_ID: ${DEV_DEFAULT_TELEGRAM_ID:-}
      DEV_ADMIN_TELEGRAM_IDS: ${DEV_ADMIN_TELEGRAM_IDS:-}
      PAYMENT_PROVIDER_KEY: ${PAYMENT_PROVIDER_KEY:-}
      PAYMENT_PROVIDER_SECRET: ${PAYMENT_PROVIDER_SECRET:-}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-1}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_media:/app/media
    restart: unless-stopped

  miniapp:
    build:
      context: ../miniapp-frontend
      dockerfile: Dockerfile
    restart: unless-stopped

  admin:
    build:
      context: ../admin-frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: ${ADMIN_BASE_PATH:-/admin/}
    restart: unless-stopped

  gateway:
    image: caddy:2.10-alpine
    depends_on:
      - backend
      - miniapp
      - admin
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  postgres_data:
  backend_media:
  caddy_data:
  caddy_config:
