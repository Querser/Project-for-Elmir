services:
  db:
    image: postgres:16
    container_name: volleyball_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-volleyball_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-volleyball_db}"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: volleyball_backend
    environment:
      # --- DB ---
      DATABASE_URL: ${DATABASE_URL}

      # --- Общие ---
      ENVIRONMENT: ${ENVIRONMENT:-development}

      # --- Telegram ---
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL}

      # --- DEV auth (чтобы работали X-User-Id / X-Telegram-Id без initData) ---
      ALLOW_INSECURE_HEADER_AUTH: ${ALLOW_INSECURE_HEADER_AUTH:-1}
      DEV_AUTO_CREATE_USER_FROM_HEADER: ${DEV_AUTO_CREATE_USER_FROM_HEADER:-1}
      DEV_DEFAULT_TELEGRAM_ID: ${DEV_DEFAULT_TELEGRAM_ID:-1726307767}
      # опционально, если у тебя это в deps.py используется:
      DEV_ADMIN_TELEGRAM_IDS: ${DEV_ADMIN_TELEGRAM_IDS:-1726307767}

      # --- Payments (если backend реально читает их из env) ---
      PAYMENT_PROVIDER_KEY: ${PAYMENT_PROVIDER_KEY}
      PAYMENT_PROVIDER_SECRET: ${PAYMENT_PROVIDER_SECRET}

      # --- Postgres vars (опционально, но удобно иметь внутри backend) ---
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-volleyball_db}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}

    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - ../backend:/app
    restart: unless-stopped

  miniapp:
    build:
      context: ../miniapp-frontend
      dockerfile: Dockerfile
    container_name: volleyball_miniapp
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL}
      BACKEND_PORT: ${BACKEND_PORT:-8001}
    ports:
      - "8081:80"
    restart: unless-stopped

  admin:
    build:
      context: ../admin-frontend
      dockerfile: Dockerfile
    container_name: volleyball_admin
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      BACKEND_PORT: ${BACKEND_PORT:-8001}
    ports:
      - "8082:80"
    restart: unless-stopped

volumes:
  postgres_data:
